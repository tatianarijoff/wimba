; The RoundChamber verification case, written as a pytlwall chamber config.
;
; Same wall as examples/RoundChamber_TLW/RoundChamber_TLW_config.yaml, which is itself
; IW2D's RoundChamberInputFile.txt key by key: CIRCULAR, radius 2 mm, length
; 1 m, beta = 1, sigma = 2e5 S/m (DC resistivity 5e-06 Ohm.m), relaxation time
; 4.2 ps, epsr 1, susceptibility 0, layer extending to infinity,
; gamma = 479.605064966. Here it is stated in pytlwall's own format instead of
; WIMBA's; the three files describe one wall, so their curves can be compared.
;
; Open it with Component > Load pytlwall Config... That menu entry takes THIS
; format. A WIMBA config is opened with File > Open Config; the two are not
; interchangeable, which is the point of having both examples side by side.
;
; The single layer is the boundary: it is the half-space outside the beam pipe
; and has no thickness of its own, which is why it is stated under [boundary]
; and not as layer0.

[base_info]
component_name = RoundChamber_pytlwall
chamber_shape = CIRCULAR
pipe_radius_m = 0.002
pipe_len_m = 1.0
betax = 1.0
betay = 1.0

[layers_info]
; number of layers before the boundary
nbr_layers = 0

[boundary]
type = CW
; DC conductivity in S/m - infinity is not allowed
sigmaDC = 2.0e5
; real relative permittivity
epsr = 1.0
; relaxation time for permittivity, in seconds
tau = 4.2e-12
; mu infinity
muinf_Hz = 0.0
; relaxation frequency for permeability in Hz - zero is not allowed
k_Hz = inf
RQ = 0.0

[frequency_info]
; exponents: 1e3 Hz to 1e11 Hz, 100 points per decade
fmin = 3
fmax = 11
fstep = 2

[beam_info]
gammarel = 479.605064966
