[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wimba"
version = "0.0.1"
description = "Wake & Impedance Model Builder for Accelerators"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
# matplotlib is a runtime dependency, not an extra: `wimba run` and `wimba plot`
# write figures, and those are core commands - the README sends a new user
# straight at `wimba run`.
dependencies = ["numpy", "pyyaml", "matplotlib"]
authors = [
    { name = "Tatiana Rijoff" },
    { name = "Carlo Zannini" },
]

[project.optional-dependencies]
dev = ["pytest", "xwakes"]
# reading impedance tables out of .xlsx / .xls; plain text needs nothing extra
spreadsheets = ["pandas", "openpyxl"]
# ruamel.yaml is what keeps a user's comments alive when the GUI writes a
# config back: PyYAML parses the text away, ruamel round-trips it.
gui = ["PyQt6", "ruamel.yaml"]

[project.scripts]
wimba = "wimba.cli:main"
wimba-gui = "wimba.gui.app:main"

[tool.setuptools.packages.find]
include = ["wimba*"]

[tool.setuptools.package-data]
"wimba.gui" = ["assets/*.png"]
"wimba" = ["defaults/*.yaml"]
